<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أومني | Premium Store</title>
  <style>
    :root {
      --bg: #070d18;
      --bg-2: #0d1728;
      --panel: rgba(18, 28, 42, .96);
      --panel-soft: rgba(23, 34, 49, .9);
      --line: rgba(148, 163, 184, .18);
      --gold: #f8c75d;
      --gold-2: #f39c12;
      --blue: #5aa9ff;
      --violet: #8f7cf3;
      --text: #edf3ff;
      --muted: #a9b7cb;
      --shadow: 0 18px 40px rgba(2,6,23,.45);
      --success: #34d399;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(143,124,243,.22), transparent 30%),
        radial-gradient(circle at top right, rgba(90,169,255,.18), transparent 28%),
        linear-gradient(180deg, #070d18 0%, #0b1424 100%);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select {
      font: inherit;
    }
    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 22px 20px 90px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(7, 13, 24, .78);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 1220px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .brand {
      font-size: clamp(1.7rem, 3vw, 2.3rem);
      font-weight: 900;
      color: var(--gold);
      letter-spacing: -.5px;
    }
    .nav {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    }
    .nav button, .primary-btn, .secondary-btn, .ghost-btn, .small-btn, .chip, .tab {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: .2s ease;
      font-weight: 800;
    }
    .nav button, .ghost-btn, .chip, .tab {
      background: rgba(255,255,255,.03);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 10px 14px;
    }
    .primary-btn {
      background: linear-gradient(135deg, var(--gold-2), var(--gold));
      color: #0c1320;
      padding: 12px 18px;
      box-shadow: 0 10px 24px rgba(248,199,93,.25);
    }
    .secondary-btn {
      background: linear-gradient(135deg, #1d4ed8, #3758d8);
      color: white;
      padding: 12px 18px;
      border: none;
    }
    .small-btn {
      padding: 9px 12px;
      font-size: .82rem;
    }
    .nav button:hover, .primary-btn:hover, .secondary-btn:hover, .ghost-btn:hover, .chip:hover, .tab:hover, .small-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }
    .hero {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
      margin-top: 28px;
      align-items: stretch;
    }
    .hero-panel, .panel, .wallet-card, .promo-card, .product-card, .stat-box {
      background: linear-gradient(180deg, rgba(18,28,42,.98), rgba(12,20,31,.97));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .hero-panel {
      padding: 28px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(248,199,93,.12), rgba(90,169,255,.08), rgba(18,28,42,.96));
    }
    .badge {
      display: inline-block;
      padding: 8px 12px;
      background: rgba(248,199,93,.12);
      border: 1px solid rgba(248,199,93,.45);
      color: var(--gold);
      border-radius: 999px;
      font-size: .76rem;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: clamp(2.3rem, 5vw, 4.2rem);
      margin: 0 0 16px;
      line-height: 1.12;
      letter-spacing: -.04em;
    }
    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 60ch;
      margin-bottom: 20px;
    }
    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(100px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .stat-box {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 96px;
      text-align: center;
    }
    .stat-box strong {
      font-size: 1.3rem;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .stat-box span {
      color: var(--muted);
      font-size: .8rem;
      font-weight: 700;
    }
    .hero-side {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .wallet-card, .promo-card {
      padding: 20px;
    }
    .mini-title {
      font-size: .82rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      margin-bottom: 14px;
      font-weight: 800;
    }
    .wallet-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,.02);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 10px;
    }
    .wallet-row strong {
      color: var(--gold);
      font-size: 1.15rem;
    }
    .promo-card ul {
      margin: 0;
      padding-right: 18px;
      color: var(--muted);
    }
    .section-head {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      margin: 34px 0 16px;
    }
    .section-head h2 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.1rem);
    }
    .filters {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .chip.active, .tab.active {
      background: rgba(248,199,93,.12);
      border-color: rgba(248,199,93,.4);
      color: var(--gold);
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }
    .product-card {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 280px;
    }
    .product-icon {
      width: 62px; height: 62px;
      border-radius: 18px;
      display: grid; place-items: center;
      font-size: 2.1rem;
      background: linear-gradient(135deg, rgba(90,169,255,.12), rgba(143,124,243,.12));
      border: 1px solid rgba(143,124,243,.2);
    }
    .product-card h3 {
      margin: 0;
      font-size: 1.2rem;
    }
    .product-card p {
      margin: 0;
      color: var(--muted);
      flex: 1;
    }
    .product-footer {
      display: flex; justify-content: space-between; align-items: end; gap: 10px;
    }
    .price {
      color: var(--gold);
      font-size: 1.4rem;
      font-weight: 900;
    }
    .old-price {
      color: var(--muted);
      font-size: .78rem;
      text-decoration: line-through;
      margin-top: 4px;
    }
    .layout {
      display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 18px; margin-top: 32px;
    }
    .panel {
      padding: 18px;
    }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .cart-item:last-child { border-bottom: none; }
    .qty-wrap { display: flex; align-items: center; gap: 10px; }
    .qty-box {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 12px; padding: 5px 8px;
    }
    .qty-box button {
      background: transparent; border: none; color: var(--gold); cursor: pointer; font-size: 1.1rem; width: 26px; height: 26px; border-radius: 8px;
    }
    .summary-box {
      background: rgba(248,199,93,.08); border: 1px solid rgba(248,199,93,.25); border-radius: 12px; padding: 12px; margin-top: 16px;
    }
    .summary-row {
      display: flex; justify-content: space-between; align-items: center; font-weight: 700;
    }
    .auth-panel {
      max-width: 720px; margin: 30px auto 0;
    }
    .auth-tabs {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .tab {
      flex: 1; padding: 12px; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,.02); border: 1px solid var(--line);
    }
    .form-grid {
      display: grid; gap: 12px;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      color: var(--text);
      outline: none;
    }
    .wide { width: 100%; margin-top: 14px; }
    .muted { color: var(--muted); }
    .tiny-pill {
      display: inline-flex; padding: 6px 10px; border-radius: 999px; background: rgba(248,199,93,.08); color: var(--gold); border: 1px solid rgba(248,199,93,.25); font-size: .76rem; font-weight: 800;
    }
    .empty-panel {
      background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 16px; padding: 18px; color: var(--muted);
    }
    .chat-widget {
      position: fixed;
      right: 20px; bottom: 20px;
      width: min(360px, calc(100vw - 24px));
      background: rgba(10,15,25,.98);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      z-index: 50;
    }
    .chat-header {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      padding: 12px 14px;
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 800;
    }
    .chat-body {
      max-height: 260px; overflow: auto; padding: 12px; background: rgba(15,23,42,.75);
    }
    .bubble {
      max-width: 85%; padding: 10px 12px; border-radius: 12px; margin-bottom: 10px; font-size: .92rem;
    }
    .bubble.user { background: #1d4ed8; margin-right: auto; }
    .bubble.bot { background: rgba(255,255,255,.02); border: 1px solid var(--line); margin-left: auto; }
    .chat-input {
      display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line);
      background: rgba(15,23,42,.9);
    }
    .chat-input input {
      flex: 1; background: rgba(255,255,255,.03); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    }
    .hidden { display: none !important; }
    @media (max-width: 900px) {
      .hero, .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .topbar-inner { justify-content: center; }
      .nav { justify-content: center; }
      .stats-grid { grid-template-columns: repeat(2, minmax(100px,1fr)); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">🚀 أومني</div>
      <nav class="nav">
        <button data-view="home">الرئيسية</button>
        <button data-view="products">المنتجات</button>
        <button data-view="cart">السلة</button>
        <button data-view="auth">تسجيل الدخول</button>
        <button data-view="admin">لوحة الإدارة</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="app"></div>
  </main>

  <div id="chat-widget" class="chat-widget hidden"></div>

  <script src="js/aman-core.js"></script>
  <script src="js/aman-views.js"></script>
  <script src="js/aman-admin.js"></script>
  <script src="js/aman-chat.js"></script>
  <script src="js/aman-reviews.js"></script>
  <script>
    const state = {
      view: 'home',
      products: [],
      cart: [],
      user: null,
      authMode: 'login',
      filter: 'all',
      chatMessages: [{ sender: 'bot', text: 'مرحباً! كيف يمكنني مساعدتك؟' }],
      adminStats: null
    };

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function saveCart() {
      window.OmniCore.saveCart(state.cart);
    }

    function getCartCount() {
      return state.cart.reduce((sum, item) => sum + (item.qty || 1), 0);
    }

    async function loadProducts() {
      try {
        const res = await window.OmniCore.api('products/list', {}, 'GET');
        state.products = res.products || [];
      } catch (err) {
        state.products = [];
      }
    }

    async function loadAdminStats() {
      const user = window.OmniCore.getUser();
      if (!user || user.role !== 'admin') return;
      try {
        const res = await window.OmniCore.api('admin/stats', {}, 'GET');
        state.adminStats = res.stats || null;
      } catch (err) {
        state.adminStats = null;
      }
    }

    function addToCart(product) {
      const existing = state.cart.find(item => item.id === product.id);
      if (existing) existing.qty += 1;
      else state.cart.push({ ...product, qty: 1 });
      saveCart();
      if (state.view === 'cart') render();
    }

    function changeQty(id, delta) {
      const item = state.cart.find(x => x.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) state.cart = state.cart.filter(x => x.id !== id);
      saveCart();
      render();
    }

    function removeFromCart(id) {
      state.cart = state.cart.filter(x => x.id !== id);
      saveCart();
      render();
    }

    async function handleAuthSubmit(evt) {
      evt.preventDefault();
      const form = evt.target;
      const payload = {
        identifier: form.identifier.value,
        password: form.password.value,
        name: form.name?.value || '',
        phone: form.phone?.value || '',
        email: form.email?.value || '',
        role: form.role?.value || 'customer'
      };
      const route = state.authMode === 'login' ? 'auth/login' : 'auth/register';
      const res = await window.OmniCore.api(route, payload, 'POST');

      if (res.success) {
        state.user = res.user;
        window.OmniCore.setUser(res.user);
        window.OmniCore.setToken(res.token);
        state.view = 'products';
        render();
        return;
      }
      alert(res.error || 'حدث خطأ غير متوقع');
    }

    async function submitOrder() {
      if (!state.user) {
        state.view = 'auth';
        render();
        return;
      }
      if (!state.cart.length) {
        alert('السلة فارغة');
        return;
      }

      const payload = {
        items: state.cart.map(item => ({ id: item.id, quantity: item.qty })),
        customer_name: state.user.name,
        customer_phone: state.user.phone,
        address: 'سوريا',
        city: 'دمشق',
        notes: 'تم الطلب من التطبيق'
      };

      const res = await window.OmniCore.api('orders/create', payload, 'POST');
      if (res.success) {
        state.cart = [];
        saveCart();
        alert('تمت إضافة الطلب بنجاح! رقم الطلب: ' + res.order_number);
        state.view = 'products';
        render();
      } else {
        alert(res.error || 'فشل إنشاء الطلب');
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      state.chatMessages.push({ sender: 'user', text });
      input.value = '';
      renderChatWidget();

      const botReply = text.includes('طلب') || text.includes('سلة') ? 'يمكنك التوجه إلى قسم السلة أو المنتجات لإتمام الطلب.' :
        text.includes('حساب') || text.includes('تسجيل') ? 'يمكنك استخدام زر تسجيل الدخول في أعلى الصفحة.' :
        'شكراً لك، نحن هنا للمساعدة. يمكنك متابعة الطلبات أو المنتجات.';

      setTimeout(() => {
        state.chatMessages.push({ sender: 'bot', text: botReply });
        renderChatWidget();
      }, 300);
    }

    function renderChatWidget() {
      const chatEl = document.getElementById('chat-widget');
      if (!chatEl || chatEl.classList.contains('hidden')) return;
      chatEl.innerHTML = `
        <div class="chat-header">
          <span>💬 الدعم الفوري</span>
          <button class="ghost-btn small-btn" data-close-chat>إغلاق</button>
        </div>
        <div class="chat-body">
          ${state.chatMessages.map(msg => `<div class="bubble ${msg.sender === 'user' ? 'user' : 'bot'}">${escapeHtml(msg.text)}</div>`).join('')}
        </div>
        <div class="chat-input">
          <input id="chat-input" type="text" placeholder="اكتب رسالتك..." />
          <button class="primary-btn small-btn" id="send-chat">إرسال</button>
        </div>
      `;

      const sendBtn = document.getElementById('send-chat');
      sendBtn.onclick = sendChatMessage;
      document.getElementById('chat-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendChatMessage();
      });
      document.querySelector('[data-close-chat]').addEventListener('click', () => chatEl.classList.add('hidden'));
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (state.view === 'home') app.innerHTML = AmanViews.renderHome(state);
      else if (state.view === 'products') app.innerHTML = AmanViews.renderProducts(state);
      else if (state.view === 'cart') app.innerHTML = AmanViews.renderCart(state);
      else if (state.view === 'auth') app.innerHTML = AmanViews.renderAuth(state);
      else if (state.view === 'admin') app.innerHTML = AmanAdmin.renderAdmin(state);

      document.querySelectorAll('[data-view]').forEach(btn => {
        btn.onclick = () => {
          const target = btn.getAttribute('data-view');
          state.view = target;
          render();
        };
      });

      document.querySelectorAll('[data-filter]').forEach(btn => {
        btn.onclick = () => {
          state.filter = btn.dataset.filter;
          render();
        };
      });

      document.querySelectorAll('[data-product-add]').forEach(btn => {
        btn.onclick = () => addToCart(state.products.find(p => p.id === btn.dataset.productAdd));
      });

      document.querySelectorAll('[data-qty]').forEach(btn => {
        btn.onclick = () => changeQty(btn.dataset.qty, Number(btn.dataset.delta || 1));
      });

      document.querySelectorAll('[data-remove-cart]').forEach(btn => {
        btn.onclick = () => removeFromCart(btn.dataset.removeCart);
      });

      const orderBtn = document.getElementById('submit-order');
      if (orderBtn) orderBtn.onclick = submitOrder;

      const authForm = document.getElementById('auth-form');
      if (authForm) authForm.addEventListener('submit', handleAuthSubmit);

      const toggleLogin = document.getElementById('toggle-login');
      const toggleRegister = document.getElementById('toggle-register');
      if (toggleLogin) toggleLogin.onclick = () => { state.authMode = 'login'; render(); };
      if (toggleRegister) toggleRegister.onclick = () => { state.authMode = 'register'; render(); };

      const chatToggle = document.getElementById('chat-toggle');
      if (chatToggle) {
        chatToggle.onclick = () => {
          const chatEl = document.getElementById('chat-widget');
          chatEl.classList.toggle('hidden');
          if (!chatEl.classList.contains('hidden')) renderChatWidget();
        };
      }

      const chatWidget = document.getElementById('chat-widget');
      if (chatWidget) {
        chatWidget.classList.remove('hidden');
        renderChatWidget();
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      state.user = window.OmniCore.getUser();
      state.cart = window.OmniCore.getCart();
      await loadProducts();
      await loadAdminStats();
      render();
    });
  </script>
</body>
</html>
